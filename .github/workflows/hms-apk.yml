name: HMS APK release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Android version, for example v1.3.1"
        required: true
        default: v1.3.1

permissions:
  contents: read

concurrency:
  group: hms-apk-release
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      PUSHGO_RELEASE_STORE_PASSWORD: ${{ secrets.PUSHGO_RELEASE_STORE_PASSWORD }}
      PUSHGO_RELEASE_KEY_ALIAS: ${{ secrets.PUSHGO_RELEASE_KEY_ALIAS }}
      PUSHGO_RELEASE_KEY_PASSWORD: ${{ secrets.PUSHGO_RELEASE_KEY_PASSWORD }}
      PUSHGO_UPDATE_FEED_URL: ${{ vars.PUSHGO_UPDATE_FEED_URL }}
      PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64: ${{ vars.PUSHGO_UPDATE_FEED_ECDSA_P256_PUBLIC_KEY_B64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release identity
        run: |
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "RELEASE_TAG=hms-${RELEASE_VERSION}" >> "$GITHUB_ENV"
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: platform-tools
      - run: sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0"
      - name: Restore owner AGC configuration and signing key
        env:
          HMS_AGCONNECT_JSON_B64: ${{ secrets.HMS_AGCONNECT_JSON_B64 }}
          PUSHGO_RELEASE_KEYSTORE_B64: ${{ secrets.PUSHGO_RELEASE_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$HMS_AGCONNECT_JSON_B64"
          test -n "$PUSHGO_RELEASE_KEYSTORE_B64"
          test -n "$PUSHGO_RELEASE_STORE_PASSWORD"
          test -n "$PUSHGO_RELEASE_KEY_ALIAS"
          test -n "$PUSHGO_RELEASE_KEY_PASSWORD"
          umask 077
          mkdir -p .ci
          printf '%s' "$HMS_AGCONNECT_JSON_B64" | base64 --decode > app/agconnect-services.json
          printf '%s' "$PUSHGO_RELEASE_KEYSTORE_B64" | base64 --decode > .ci/hms-release.keystore
          echo "PUSHGO_RELEASE_STORE_FILE=$GITHUB_WORKSPACE/.ci/hms-release.keystore" >> "$GITHUB_ENV"
          python3 - <<'PY'
          import json
          with open('app/agconnect-services.json', encoding='utf-8') as stream:
              assert json.load(stream).get('client', {}).get('package_name') == 'io.ethan.pushgo'
          PY
      - name: Test, lint and build HMS release
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 -Ppushgo.enableAbiSplits=false \
            "-Ppushgo.versionName=$RELEASE_VERSION" \
            :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Verify signer and package download
        env:
          EXPECTED_CERTIFICATE: ${{ vars.HMS_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_CERTIFICATE"
          signer="$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs app/build/outputs/apk/release/app-release.apk | sed -n 's/Signer #1 certificate SHA-256 digest: //p')"
          test "${signer,,}" = "${EXPECTED_CERTIFICATE,,}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PushGo-HMS-${RELEASE_VERSION}.apk"
          printf 'commit=%s\nversion=%s\ncertificate=%s\n' "$GITHUB_SHA" "$RELEASE_VERSION" "$signer" > dist/BUILD_INFO.txt
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PushGo-HMS-APK
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub download release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            '基于官方 PushGo Android 源码的 HMS 测试发行版。' \
            '自动检查更新失败只提示一次，记录跨启动保留；更新检查、手动检查及有效新版通知继续工作。' \
            '加入 TaskNotes 去打卡按钮，业务 HTTPS 域名在设置中配置。' \
            '使用仓库所有者提供、已登记 HMS 的测试签名证书。真实手机按钮与更新流程仍需验收。' \
            'APK、校验值及精确源码提交见本 Release 附件。' > release-notes.md
          gh release create "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "PushGo HMS $RELEASE_VERSION" \
            --notes-file release-notes.md --prerelease

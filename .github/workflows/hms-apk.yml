name: Additive push verification
on:
  push:
    branches: [repair/hms-additive]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: additive-android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
      - name: Install official Android and Rust toolchains
        run: |
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          # Preserve the official compileSdk=37 baseline on the SDK's 37.0 packaging.
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt
          rustup target add --toolchain 1.97.1 aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
          cargo +1.97.1 install cargo-ndk --version 4.1.2 --locked
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/quinn-jni
      - name: Verify official baseline and build
        run: |
          chmod +x gradlew native/quinn-jni/build-android.sh scripts/verify_jni_contract.sh
          ./gradlew --no-daemon --max-workers=2 :app:testDebugUnitTest :app:lintDebug :app:verifyRustJniContract :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/outputs/apk/
            app/schemas/
